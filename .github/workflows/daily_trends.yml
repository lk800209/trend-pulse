name: Global Trends to Feishu Bitable

on:
  schedule:
    # 每天北京时间早上 7:00 自动运行 (11:00 PM UTC)
    - cron: '0 23 * * *'
  # 允许在 GitHub Actions 页面上手动点击按钮触发
  workflow_dispatch:

jobs:
  write-to-feishu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          # 1. 安装最新版极速 uv 包管理器并配置环境路径
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          # 2. 一键安装本项目及需要的 requests 模块
          uv pip install --system . requests

      - name: Fetch Trends
        run: |
          
          export PATH="$HOME/.local/bin:$PATH"
          # 1. 抓取美国数据（新建文件）
          echo "=== COUNTRY: US ===" > raw_data.txt
          trend-pulse trending --sources github_trending,youtube_trending,x_trending,tiktok_trending --geo US --count 15 >> raw_data.txt
          
          # 2. 追加日本数据
          # echo "=== COUNTRY: JP ===" >> raw_data.txt
          # trend-pulse trending --sources github_trending,youtube_trending,x_trending,tiktok_trending --geo JP --count 15 >> raw_data.txt

          # 3. 追加韩国数据
          # echo "=== COUNTRY: KR ===" >> raw_data.txt
          # trend-pulse trending --sources github_trending,youtube_trending,x_trending,tiktok_trending --geo KR --count 15 >> raw_data.txt
          
          # 在第 14 行下面追加：
          echo "================= 查看 RAW DATA 内容 ================="
          cat raw_data.txt
                 

      - name: Process with AI and Push to Feishu
        env:
          AI_KEY: ${{ secrets.AI_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          # 4. 运行我们抽离出来的 Python 脚本
          python push_to_feishu.py

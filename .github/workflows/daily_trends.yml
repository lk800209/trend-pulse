name: Global Trends to Feishu Bitable

on:
  schedule:
    - cron: '0 23 * * *'  # 每天北京时间早上 7:00 自动运行
  workflow_dispatch:     # 允许你在 GitHub 页面上手动点击按钮触发

jobs:
  write-to-feishu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv pip install --system . requests

      - name: Fetch and AI Process to Feishu
        env:
          AI_KEY: ${{ secrets.AI_API_KEY }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_APP_TOKEN: ${{ secrets.FEISHU_APP_TOKEN }}
          FEISHU_TABLE_ID: ${{ secrets.FEISHU_TABLE_ID }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          
          # 1. 抓取海外最火爆的 YouTube 趋势和 Google 趋势
          echo "=== 美国热点选题 ===" >> today_trends.txt
          trend-pulse trending --geo US --count 10 > raw_data.txt
          
          # 再追加日本热点到同一个文件里
          echo "=== 日本热点选题 ===" >> today_trends.txt
          trend-pulse trending --geo JP --count 10 >> raw_data.txt

          # 再追加台湾热点到同一个文件里
          echo "=== 日本热点选题 ===" >> today_trends.txt
          trend-pulse trending --geo TW --count 10 >> raw_data.txt
          
          # 2. 运行 Python 脚本处理，并自动批量推送到飞书多维表格
          python - <<EOF
          import os
          import json
          import requests

          with open("raw_data.txt", "r", encoding="utf-8") as f:
              raw_content = f.read()

          # 调用 AI (此处以硅基流动/DeepSeek为例，可自行替换成OpenAI的API地址)
          ai_url = "https://ark.cn-beijing.volces.com/api/plan/v3" 
          headers = {
              "Authorization": f"Bearer {os.environ['AI_KEY']}", 
              "Content-Type": "application/json"
          }

          # 极其苛刻地限制 AI 只输出标准 JSON，避免干扰运行
          prompt = f"""
          你是一个熟悉国内自媒体和小红书流量密码的【自媒体爆款导师】。
          请阅读以下我为你抓取到的今日海外实时热点数据：
          {raw_content}

          任务：从上述热点中，筛选并转化出 3 个最具备爆款潜力的“信息差”选题。
          要求：你必须严格并且只输出一个合法的 JSON 数组，不要包含任何 Markdown 格式（比如不要加上 ```json），不要有任何解释性前言或多余的话。

          JSON 数组中的每个对象格式必须如下：
          [
            {{
              "title": "爆款中文标题",
              "origin": "海外原帖视频简介/搜索热度解释",
              "outline": "详细说明国内切入角度，分步骤写下爆款脚本框架，并写3个情绪共鸣金句"
            }}
          ]
          """

          data = {
              "model": "deepseek-v4-flash",
              "messages": [{"role": "user", "content": prompt}],
              "temperature": 0.3
          }

          print("1. 正在调遣大模型脑暴中...")
          response = requests.post(ai_url, json=data, headers=headers).json()
          ai_raw_text = response['choices'][0]['message']['content'].strip()

          # 清洗 AI 偶发产生的 Markdown 包装
          if ai_raw_text.startswith("```"):
              ai_raw_text = ai_raw_text.split("```")[1]
              if ai_raw_text.startswith("json"):
                  ai_raw_text = ai_raw_text[4:]
          ai_raw_text = ai_raw_text.strip()

          topics = json.loads(ai_raw_text)

          print("2. 正在向飞书总部申请临时通行证 (Tenant Access Token)...")
          auth_url = "[https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal](https://open.feishu.cn/open-apis/auth/v3/tenant_access_token/internal)"
          auth_res = requests.post(auth_url, json={
              "app_id": os.environ["FEISHU_APP_ID"],
              "app_secret": os.environ["FEISHU_APP_SECRET"]
          }).json()
          tenant_token = auth_res["tenant_access_token"]

          print("3. 正在将选题批量运往你的飞书多维表格...")
          feishu_headers = {
              "Authorization": f"Bearer {tenant_token}",
              "Content-Type": "application/json; charset=utf-8"
          }
          
          # 调用飞书 Bitable 批量写入接口
          app_token = os.environ['FEISHU_APP_TOKEN']
          table_id = os.environ['FEISHU_TABLE_ID']
          add_record_url = f"[https://open.feishu.cn/open-apis/bitable/v1/apps/](https://open.feishu.cn/open-apis/bitable/v1/apps/){app_token}/tables/{table_id}/records/batch_create"

          records = []
          for topic in topics:
              records.append({
                  "fields": {
                      "选题标题": topic["title"],
                      "海外原帖": topic["origin"],
                      "爆款脚本大纲": topic["outline"]
                  }
              })

          write_res = requests.post(add_record_url, json={"records": records}, headers=feishu_headers).json()
          if write_res.get("code") == 0:
              print("🎉 恭喜你！每日选题已成功输送到飞书多维表格！")
          else:
              print("⚠️ 飞书写入出错：", write_res)
          EOF
